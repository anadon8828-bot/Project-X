name: Project X cloud daily update

on:
  workflow_dispatch:
  schedule:
    # 16:40 JST on Tokyo weekdays. Jobs also validate exchange dates themselves.
    - cron: "40 7 * * 1-5"

concurrency:
  group: project-x-cloud-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROJECT_X_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Database readiness gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured; no mutable output will be written."
            exit 0
          fi
      - uses: actions/setup-python@v5
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: env.DATABASE_URL != ''
      - run: python cloud_daily_job.py
        if: env.DATABASE_URL != ''
