name: Project X tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_cloud_runtime.py test_navigation.py test_research_integrity.py
      - run: python -m py_compile app.py cloud_daily_job.py persistent_store.py state_admin.py
